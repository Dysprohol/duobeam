<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DuoBeam</title>
<style>
/* Same look as the Android TV receiver: white text with a black outline on a dark card. */
:root{--pink:#ff7ad9;--violet:#a978ff;--panel:rgba(20,10,48,.55);--edge:rgba(190,150,255,.28);
  --outline:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 0 8px rgba(0,0,0,.6);
  --outline-big:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,0 -4px 0 #000,0 4px 0 #000,-4px 0 0 #000,4px 0 0 #000,0 0 12px rgba(0,0,0,.6)}
body{margin:0;background:#07041a;color:#fff;width:1920px;height:1080px;overflow:hidden;font-family:"Samsung One","SamsungOne",Tizen,sans-serif;text-shadow:var(--outline)}
#v{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000}
/* waiting screen */
#idle{position:absolute;inset:0;background:url(img/bg.jpg) center/cover;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#idle.hidden{opacity:0;pointer-events:none}
#idle:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(7,4,24,0) 0%,rgba(7,4,24,.65) 100%)}
.card{position:relative;width:1180px;box-sizing:border-box;padding:56px 72px;border-radius:40px;background:var(--panel);border:2px solid var(--edge)}
.head{display:flex;align-items:center;gap:36px}
.head img{width:150px;height:150px}
h1{margin:0;font-size:84px;line-height:1.1;text-shadow:var(--outline-big)}
#state{font-size:36px;margin-top:4px}
#state .dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--pink);border:2px solid #000;margin-right:10px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.addr{margin:36px 0 0;font-size:30px}
#addr{font-size:96px;font-weight:bold;letter-spacing:3px;text-shadow:var(--outline-big)}
.steps{margin-top:24px;font-size:32px;line-height:1.3}
.steps small{font-size:26px}
.foot{margin-top:40px;font-size:24px;display:flex;flex-direction:column;gap:4px}
#ver{opacity:.8}
#flag{position:absolute;top:40px;right:48px;font-size:34px;font-weight:bold;padding:8px 18px;border-radius:18px;background:rgba(0,0,0,.35);border:2px solid var(--edge)}
/* layout switch: spinner instead of the welcome card */
#switching{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:rgba(20,10,48,.92);opacity:0;pointer-events:none;transition:opacity .35s}
#switching.on{opacity:1}
#switching .ring{width:120px;height:120px;box-sizing:border-box;border-radius:50%;border:10px solid rgba(190,150,255,.18);border-top-color:var(--pink);
  border-right-color:var(--violet);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#switchingText{font-size:44px}
/* stats overlay during playback */
#hud{position:absolute;left:24px;top:24px;font:22px/1.3 monospace;white-space:pre;background:rgba(20,10,48,.7);
  border:2px solid var(--edge);padding:8px 14px;border-radius:12px}
</style></head>
<body>
<video id="v" playsinline></video>
<div id="idle">
  <div class="card">
    <div class="head"><img src="icon.png"><div><h1>DuoBeam</h1><div id="state"><span class="dot"></span><span id="stateText"></span></div></div></div>
    <div id="flag"></div>
    <div class="addr" id="addrLabel"></div>
    <div id="addr">-</div>
    <div class="steps" id="steps"></div>
    <div class="foot"><span id="keys"></span><span id="ver"></span></div>
  </div>
</div>
<div id="switching"><div class="ring"></div><div id="switchingText"></div></div>
<div id="hud" style="display:none"></div>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="js/i18n.js"></script>
<script src="js/emss.js"></script>
<script src="js/player.js"></script>
</body></html>
